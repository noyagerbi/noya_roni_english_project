<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Quest — English Vocabulary</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#ff67c8,#ff46a0,#d80088);color:#fff;min-height:100vh}
.container{max-width:950px;margin:auto;padding:25px}
h1{text-align:center;font-size:42px;margin:8px 0}.subtitle{text-align:center;opacity:.85;margin-bottom:22px}
.card{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:24px;box-shadow:0 15px 45px #0005}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}.stat{background:#0004;padding:10px 16px;border-radius:14px}
.word{text-align:center;font-size:38px;font-weight:bold;margin:22px 0 6px;direction:ltr}.pos{text-align:center;color:#c4b5fd;font-style:italic}
.question{text-align:center;font-size:19px;margin:20px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{padding:17px;border:0;border-radius:15px;background:#fff;color:#111827;font-size:17px;cursor:pointer;transition:.2s}.answers button:hover{transform:translateY(-2px);background:#e0e7ff}
.answers button.correct{background:#86efac}.answers button.wrong{background:#fca5a5}
.controls{text-align:center;margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.controls button{border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:#a78bfa;color:#fff;font-weight:bold}
.feedback{text-align:center;min-height:30px;font-size:18px;margin-top:15px;font-weight:bold}
.progress{height:10px;background:#0005;border-radius:20px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#34d399;width:0%;transition:.3s}
.menu{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.menu button{padding:10px 14px;border:0;border-radius:12px;cursor:pointer;background:#ffffff22;color:#fff;border:1px solid #ffffff33}.menu button.active{background:#8b5cf6}
.hidden{display:none}.end{text-align:center}.end h2{font-size:32px}.small{font-size:14px;opacity:.75;text-align:center;margin-top:15px}
@media(max-width:650px){.answers{grid-template-columns:1fr}h1{font-size:31px}.word{font-size:29px}}

/* Mobile / iPhone / Android optimization */
html, body {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
}
body {
  min-height: 100dvh;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 48px;
}
.container {
  width: 100%;
  max-width: 950px;
  padding: clamp(14px, 4vw, 25px);
  margin: 0 auto;
}
.card {
  width: 100%;
}
.word {
  overflow-wrap: anywhere;
  line-height: 1.15;
}
.answers button {
  width: 100%;
  min-height: 58px;
  padding: 14px 12px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}
.stats {
  gap: 7px;
}
.stat {
  flex: 1 1 auto;
  text-align: center;
}
.controls button {
  min-width: 130px;
}
@media (max-width: 700px) {
  h1 { font-size: clamp(28px, 8vw, 38px); }
  .subtitle { font-size: 15px; }
  .card { padding: 16px; border-radius: 18px; }
  .question { font-size: 17px; line-height: 1.35; }
  .answers { grid-template-columns: 1fr; gap: 10px; }
}
@media (max-width: 420px) {
  .container { padding: 10px; }
  .card { padding: 13px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; }
  .stat { width: 100%; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; }
  .controls button { width: 100%; min-width: 0; }
}
@media (max-width: 360px) {
  .controls { grid-template-columns: 1fr; }
  .answers button { font-size: 16px; }
}

</style>
</head>
<body>
<div class="container">
<h1>Word Quest</h1>
<div class="subtitle">An interactive vocabulary adventure</div>

<div class="menu">
<button class="mode active" onclick="setMode('he')">🇬🇧 English → Hebrew</button>
<button class="mode" onclick="setMode('en')">🇬🇧 English → Definition</button>

</div>

<div class="card">
<div class="stats">
<div class="stat">⭐ Score: <b id="score">0</b></div>

<div class="stat">📚 <b id="count">1</b> / <b id="total">0</b></div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div id="game">
<div class="word" id="word"></div>
<div class="pos" id="pos"></div>
<div class="question" id="question"></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div>
</div>

<div id="end" class="end hidden">
<h2>good job! Round Complete!</h2>
<p id="final"></p>
<button onclick="restart()" style="padding:14px 25px;border:0;border-radius:13px;background:#34d399;font-weight:bold;cursor:pointer">Play Again 🔄</button>
</div>

<div class="controls">
<button onclick="speak()">🔊 Hear Word</button>
<button onclick="showHint()">💡 Hint</button>
</div>
<div class="small">Tip: If you make a mistake, the word may appear again later to help you remember it.</div>
</div>
</div>

controlled or not costing money"}, {"w": "grab", "pos": "verb", "he": "לחטוף / לתפוס", "en": "to take or hold suddenly"}, {"w": "here you are / here it is", "pos": "phrase", "he": "הנה לך / הנה זה", "en": "used when giving something to someone"}, {"w": "lightly", "pos": "adverb", "he": "בעדינות / בקלילות", "en": "gently or with little force"}, {"w": "name", "pos": "noun", "he": "שם", "en": "a word used to identify a person or thing"}, {"w": "pour", "pos": "verb", "he": "למזוג / לשפוך", "en": "to make liquid flow from one container to another"}, {"w": "show up", "pos": "phrase", "he": "להופיע / להגיע", "en": "to arrive or become visible"}, {"w": "sink", "pos": "verb", "he": "לשקוע", "en": "to go down below the surface"}, {"w": "special offer", "pos": "phrase", "he": "הצעה מיוחדת", "en": "a special deal at a reduced or attractive price"}, {"w": "warm", "pos": "verb", "he": "לחמם", "en": "to make something warmer"}, {"w": "Who cares?", "pos": "phrase", "he": "למי אכפת?", "en": "used to say something is not important to you"}, {"w": "argue", "pos": "verb", "he": "להתווכח", "en": "to disagree with someone by speaking angrily or strongly"}, {"w": "capacity", "pos": "noun", "he": "קיבולת / יכולת", "en": "the maximum amount something can contain or do"}, {"w": "cure", "pos": "verb", "he": "לרפא", "en": "to make an illness go away"}, {"w": "deaf", "pos": "adjective", "he": "חירש / כבד שמיעה", "en": "unable to hear or unable to hear well"}, {"w": "escape", "pos": "noun", "he": "בריחה", "en": "an act of getting away from a place or danger"}, {"w": "free will", "pos": "phrase", "he": "רצון חופשי", "en": "the ability to choose freely"}, {"w": "lonely", "pos": "adjective", "he": "בודד", "en": "sad because you are alone or lack company"}, {"w": "quit", "pos": "verb", "he": "להפסיק / לפרוש", "en": "to stop doing something"}, {"w": "shaming", "pos": "noun", "he": "ביוש / השפלה", "en": "the act of making someone feel ashamed"}, {"w": "signal", "pos": "noun", "he": "אות / סימן", "en": "a sign used to communicate information"}, {"w": "strike", "pos": "verb", "he": "להכות / לפגוע", "en": "to hit someone or something"}, {"w": "suspect", "pos": "verb", "he": "לחשוד", "en": "to think something is probably true or someone did something wrong"}, {"w": "tribe", "pos": "noun", "he": "שבט", "en": "a social group with shared culture or ancestry"}, {"w": "underline", "pos": "verb", "he": "להדגיש בקו תחתון", "en": "to draw a line under words"}, {"w": "weather forecast", "pos": "phrase", "he": "תחזית מזג האוויר", "en": "a report about expected weather"}, {"w": "annoy", "pos": "verb", "he": "לעצבן", "en": "to make someone slightly angry"}, {"w": "bold", "pos": "adjective", "he": "נועז / מודגש", "en": "brave or visually strong"}, {"w": "casual", "pos": "adjective", "he": "לא רשמי / יומיומי", "en": "relaxed and not formal"}, {"w": "cure", "pos": "noun", "he": "תרופה / מרפא", "en": "a treatment that makes an illness better or disappear"}, {"w": "debt", "pos": "noun", "he": "חוב", "en": "money that someone owes"}, {"w": "fare", "pos": "noun", "he": "דמי נסיעה / מחיר נסיעה", "en": "the money paid for a journey"}, {"w": "give up something / give something up", "pos": "phrase", "he": "לוותר על משהו", "en": "to stop having or doing something"}, {"w": "layer", "pos": "noun", "he": "שכבה", "en": "one level or thickness covering something"}, {"w": "loan", "pos": "noun", "he": "הלוואה", "en": "money borrowed that must be paid back"}, {"w": "mark", "pos": "noun", "he": "סימן / ציון", "en": "a visible sign or a grade"}, {"w": "modest", "pos": "adjective", "he": "צנוע", "en": "not talking proudly about your abilities or achievements"}, {"w": "peaceful", "pos": "adjective", "he": "שליו / רגוע", "en": "calm and without violence"}, {"w": "race", "pos": "noun", "he": "מרוץ / תחרות", "en": "a competition to see who is fastest"}, {"w": "some kind of", "pos": "phrase", "he": "איזשהו סוג של", "en": "a particular but not clearly identified type of"}, {"w": "strengthen", "pos": "verb", "he": "לחזק", "en": "to make stronger"}];
let mode='he', deck=[], index=0, score=0, lives=3, streak=0, locked=false;

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){
 deck=shuffle(WORDS); index=0; score=0; lives=3; streak=0; locked=false;
 document.getElementById('game').classList.remove('hidden');
 document.getElementById('end').classList.add('hidden');
 render();
}
function setMode(m){
 mode=m;
 document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
 start();
}
function render(){
 if(index>=deck.length || lives<=0){finish();return}
 locked=false;
 const x=deck[index];
 document.getElementById('word').textContent=x.w;
 document.getElementById('pos').textContent=x.pos;
 document.getElementById('count').textContent=index+1;
 document.getElementById('total').textContent=deck.length;
 document.getElementById('score').textContent=score;
 document.getElementById('lives').textContent=lives;
 document.getElementById('streak').textContent=streak;
 document.getElementById('bar').style.width=((index/deck.length)*100)+'%';
 document.getElementById('feedback').textContent='';
 let correct, prompt;
 if(mode==='he'){correct=x.he;prompt='Choose the correct Hebrew translation:'}
 else {correct=x.en;prompt='Which English definition is correct?'}
 document.getElementById('question').textContent=prompt;
 let pool=shuffle(WORDS.filter(y=>y.w!==x.w)).slice(0,3).map(y=>mode==='he'?y.he:y.en);
 let opts=shuffle([correct,...pool]);
 const box=document.getElementById('answers');box.innerHTML='';
 opts.forEach(o=>{
  const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(b,o,correct,x);box.appendChild(b)
 });
}
function answer(btn,choice,correct,x){
 if(locked)return;locked=true;
 const ok=choice===correct;
 document.querySelectorAll('.answers button').forEach(b=>b.disabled=true);
 if(ok){
  btn.classList.add('correct');streak++;
  score+=10+(streak>=3?5:0);
  document.getElementById('feedback').textContent=streak>=3?'🔥 Great! Streak: '+streak+'!':'✅ נכון!';
 }else{
  btn.classList.add('wrong');lives--;streak=0;
  document.getElementById('feedback').textContent='❌ Not this time. Correct answer: '+correct;
 }
 setTimeout(()=>{index++;render()},5000);
}
function showHint(){
 if(locked)return;
 const x=deck[index];
 if(mode==='he'){
   document.getElementById('feedback').textContent='💡 Hint: '+x.en;
 }else{
   document.getElementById('feedback').textContent='💡 Hint: '+x.he;
 }
}
function speak(){
 if(!deck[index])return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(deck[index].w);u.lang='en-US';u.rate=.8;
 speechSynthesis.speak(u);
}
function finish(){
 document.getElementById('game').classList.add('hidden');
 document.getElementById('end').classList.remove('hidden');
 document.getElementById('final').innerHTML=`You scored <b>${score}</b> points out of ${deck.length*10}  possible.<br>Your best streak this round: <b>${streak}</b>`;
}
function restart(){start()}
start();
</script>
</body>
</html>
